name: release
# Builds, signs and publishes the binaries peers update themselves from
# (LOC-86; see "Keeping peers up to date" in README.md).
#
#   push to main  -> prerelease build-<sha7>, channel "main"; keeps the
#                    newest 20 build-* releases
#   push tag v*   -> release <tag>, channel "stable"
#
# Never on pull_request: the release job runs on the self-hosted runner
# (labels self-hosted, linux, locus), which only code already on main or
# tagged may reach. It needs the checks (ci.yml) to pass first, so a red
# build is never released.
#
# The runner needs git, make, curl and tar (Go comes from setup-go, gh is
# fetched when missing) and the signing key: the file
# /etc/locus-release/key (base64 private key, mode 600, owned by the runner
# user), or else the repository secret LOCUS_RELEASE_KEY.
on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# One release at a time, in push order; never cancel one half published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: [self-hosted, linux, locus]
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_VERSION: 2.62.0
      KEEP_BUILDS: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the history and the v* tags.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Release metadata
        run: |
          set -euo pipefail
          version=$(git describe --tags --match 'v*' --always)
          short=$(git rev-parse --short=7 HEAD)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            channel=stable tag=$GITHUB_REF_NAME title=$GITHUB_REF_NAME
          else
            channel=main tag=build-$short title="build $version"
          fi
          {
            echo "RELEASE_VERSION=$version"
            echo "RELEASE_COMMIT=$(git rev-parse HEAD)"
            echo "RELEASE_COMMIT_TIME=$(git show -s --format=%cI HEAD)"
            echo "RELEASE_CHANNEL=$channel"
            echo "RELEASE_TAG=$tag"
            echo "RELEASE_TITLE=$title"
          } >> "$GITHUB_ENV"
          echo "release $tag: version $version, channel $channel"

      - name: Build
        run: >-
          make dist
          VERSION="$RELEASE_VERSION" COMMIT="$RELEASE_COMMIT" COMMIT_TIME="$RELEASE_COMMIT_TIME"

      - name: Manifest
        run: >-
          go run ./cmd/locus-release manifest -dir dist
          -version "$RELEASE_VERSION" -commit "$RELEASE_COMMIT"
          -commit-time "$RELEASE_COMMIT_TIME" -channel "$RELEASE_CHANNEL"

      - name: Sign
        env:
          LOCUS_RELEASE_KEY_FILE: /etc/locus-release/key
          LOCUS_RELEASE_KEY: ${{ secrets.LOCUS_RELEASE_KEY }}
        run: go run ./cmd/locus-release sign -in dist/manifest.json -out dist/manifest.sig

      # The same check every peer makes before installing: a key that does
      # not match the public key compiled into the binaries fails here, not
      # on the peers.
      - name: Verify
        run: go run ./cmd/locus-release verify -dir dist

      - name: Ensure gh
        run: |
          set -euo pipefail
          if command -v gh >/dev/null; then gh --version; exit 0; fi
          case "$(uname -m)" in x86_64) arch=amd64 ;; aarch64|arm64) arch=arm64 ;; *) echo "unsupported $(uname -m)"; exit 1 ;; esac
          dir="$RUNNER_TEMP/gh"
          mkdir -p "$dir"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_${arch}.tar.gz" \
            | tar -xz -C "$dir" --strip-components=1
          echo "$dir/bin" >> "$GITHUB_PATH"

      - name: Publish
        run: |
          set -euo pipefail
          assets=(dist/locus-* dist/manifest.json dist/manifest.sig dist/SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # A re-run of this workflow: replace the assets.
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            exit 0
          fi
          notes="locus $RELEASE_VERSION, commit $RELEASE_COMMIT, channel $RELEASE_CHANNEL. manifest.sig is an ed25519 signature over manifest.json; peers install only what verifies with the key compiled into them."
          if [ "$RELEASE_CHANNEL" = main ]; then
            gh release create "$RELEASE_TAG" "${assets[@]}" --target "$RELEASE_COMMIT" \
              --title "$RELEASE_TITLE" --notes "$notes" --prerelease --latest=false
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag \
              --title "$RELEASE_TITLE" --notes "$notes"
          fi

      - name: Prune old builds
        if: github.ref_type == 'branch'
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName,createdAt \
            --jq "[.[] | select(.tagName | startswith(\"build-\"))] | sort_by(.createdAt) | reverse | .[${KEEP_BUILDS}:] | .[].tagName" \
            | while read -r tag; do
                echo "deleting release and tag $tag"
                gh release delete "$tag" --yes --cleanup-tag
              done
