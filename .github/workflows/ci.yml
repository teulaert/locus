name: ci
# Pushes to main and tags run these jobs through release.yml, which calls
# this workflow and releases only once they pass. Every job here
# runs on GitHub-hosted runners: pull requests, forks included, never
# reach the self-hosted release runner.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # make check includes make lint, which runs the pinned staticcheck.
      - run: make check
  race:
    # The short suite under the race detector. It needs cgo and a C compiler;
    # the ubuntu runner image ships gcc (checked below), and the shipped
    # binary still builds without either.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gcc --version
      - run: make test-race
  portability:
    # The default runtime is pure Go: it must build and install without cgo
    # anywhere, including machines with no SQLite development headers, and
    # cross-compile for macOS from Linux. This used to run on macos-latest;
    # GitHub's macOS arm64 runners are so scarce that jobs waited 15 minutes
    # and were dropped, which held up releases, and the cross-build proves
    # the same property.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make build && ./bin/locus version
      - run: GOOS=darwin GOARCH=arm64 go build ./... && GOOS=darwin GOARCH=amd64 go build ./...
      - run: GOOS=linux GOARCH=arm64 go build ./... && GOOS=windows GOARCH=amd64 go build ./...
